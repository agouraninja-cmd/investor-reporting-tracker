  /* ============ Tokens ============ */
  :root, :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0C1218; --surface:#141D26; --surface2:#1C2733; --ink:#E7EDF4; --muted:#8FA1B3;
    --accent:#5BA5EE; --accent-ink:#0B1520; --accent-soft:#1B3252;
    --ok:#41C287; --ok-soft:#12301F; --warn:#E2AC44; --warn-soft:#382C12; --bad:#E4736F; --bad-soft:#3B1C1B;
    --border:#263442; --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 26px rgba(0,0,0,.32);
    --page-glow:radial-gradient(1100px 500px at 85% -10%, #14202E 0%, var(--bg) 55%);
    --logo-dark:inline-block; --logo-light:none; --logo-shadow:drop-shadow(0 2px 6px rgba(0,0,0,.35));
    --radius:10px;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#EDF1F6; --ink:#16212C; --muted:#5C6E80;
    --accent:#2266BE; --accent-ink:#FFFFFF; --accent-soft:#E2EDFA;
    --ok:#12855A; --ok-soft:#DEF3E9; --warn:#9C6B10; --warn-soft:#FAEED6; --bad:#BE3B39; --bad-soft:#FAE4E3;
    --border:#D8E0E9; --shadow:0 1px 2px rgba(22,33,44,.07), 0 6px 18px rgba(22,33,44,.07);
    --page-glow:radial-gradient(1100px 500px at 85% -10%, #E6EDF6 0%, var(--bg) 55%);
    --logo-dark:none; --logo-light:inline-block; --logo-shadow:none;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page-glow) fixed, var(--bg);
    color:var(--ink);
    font:14px/1.5 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  h1,h2,h3,.stat .v,.t-step,.logo-word,.sheet-head h3{font-family:"Barlow","Inter","Segoe UI",sans-serif}
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-thumb{background:var(--surface2); border-radius:99px; border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  button{font:inherit; color:inherit}
  input,select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:6px 9px}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

  /* ============ Shell ============ */
  .shell{display:flex; min-height:100vh}
  .rail{
    width:216px; flex:0 0 216px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; gap:2px; position:sticky; top:0; height:100vh;
  }
  .brand{padding:6px 10px 14px; border-bottom:1px solid var(--border); margin-bottom:10px}
  .brand .lockup{display:flex; align-items:center}
  .logo-img{height:auto; filter:var(--logo-shadow)}
  .brand .logo-img{width:172px}
  .logo-img.for-dark{display:var(--logo-dark)}
  .logo-img.for-light{display:var(--logo-light)}
  .brand .sub{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-top:9px}
  .nav-sec{font-size:10.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--muted); padding:12px 10px 4px; font-weight:700; opacity:.75}
  .nav-btn{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:0; background:none;
    padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:600;
  }
  .nav-btn:hover{background:var(--surface2); color:var(--ink)}
  .nav-btn.active{background:var(--accent-soft); color:var(--accent)}
  .nav-btn .n-ic{width:18px; display:inline-flex; align-items:center; justify-content:center; opacity:.85}
  .rail-foot{margin-top:auto; padding:10px; display:flex; flex-direction:column; gap:6px}
  .rail-foot .tools{display:flex; gap:6px; flex-wrap:wrap}
  .mini-btn{border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:4px 8px; font-size:12px; cursor:pointer; color:var(--muted)}
  .mini-btn:hover{color:var(--ink); border-color:var(--muted)}
  .rail-foot .note{font-size:11px; color:var(--muted); line-height:1.4}

  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{
    display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid var(--border);
    background:var(--surface); position:sticky; top:0; z-index:20;
  }
  .topbar h1{font-size:17px; font-weight:600; margin:0; letter-spacing:.02em; text-transform:uppercase}
  .topbar .spacer{flex:1}
  .viewing-as{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
  .who-chip{display:inline-flex; align-items:center; gap:8px; font-size:13px}
  .who-name{font-weight:700}
  .pill.admin{background:var(--accent-soft); color:var(--accent); font-size:10px; padding:1px 7px}

  /* Sign-in */
  .login-wrap{min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:24px}
  .login-card{width:min(400px,100%); padding:30px 28px}
  .login-brand{margin-bottom:18px}
  .login-brand .logo-img{width:186px}
  .login-card h2{margin:0; font-size:20px; font-weight:700}
  .fld{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:12px;
       text-transform:uppercase; letter-spacing:.07em}
  .fld select, .fld input{display:block; width:100%; margin-top:5px; padding:9px 10px; font-size:14px;
       font-weight:400; text-transform:none; letter-spacing:0; color:var(--ink)}
  .login-err{background:var(--bad-soft); color:var(--bad); border-radius:8px; padding:8px 11px;
       font-size:12.5px; font-weight:600; margin-bottom:10px}
  .login-foot{margin-top:16px; font-size:11.5px; line-height:1.5; color:var(--ink); border-top:1px solid var(--border); padding-top:12px}
  .locked{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted)}
  .bell{position:relative; border:1px solid var(--border); background:var(--surface); border-radius:8px; width:36px; height:34px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:var(--muted)}
  .bell:hover{color:var(--ink)}
  .bell:hover{background:var(--surface2)}
  .bell .badge{
    position:absolute; top:-6px; right:-6px; background:var(--bad); color:#fff; border-radius:999px;
    font-size:10.5px; font-weight:700; min-width:17px; height:17px; line-height:17px; text-align:center; padding:0 3px;
  }
  .content{padding:24px 26px 60px; max-width:1200px; width:100%}

  /* ============ Common bits ============ */
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:700; margin:0 0 6px}
  .page-head{margin-bottom:18px}
  .page-head h2{margin:0; font-size:23px; font-weight:700; letter-spacing:.005em}
  .page-head p{margin:4px 0 0; color:var(--muted); max-width:62ch}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
  .btn{
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:7px 13px;
    font-weight:600; cursor:pointer; font-size:13px;
    transition:background .12s, border-color .12s, filter .12s, box-shadow .12s;
  }
  .btn:hover{background:var(--surface2); border-color:#3A4B5E}
  .btn.primary{
    background:linear-gradient(180deg,#4E97E5,#2E76CC); border-color:#3A82D6; color:#fff;
    box-shadow:0 2px 8px rgba(46,118,204,.35);
  }
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{color:var(--bad)}
  .btn.danger:hover{background:var(--bad-soft)}
  .btn.small{padding:4px 9px; font-size:12px}
  .pill{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:700; white-space:nowrap}
  .pill.active{background:var(--accent-soft); color:var(--accent)}
  .pill.done{background:var(--ok-soft); color:var(--ok)}
  .pill.overdue{background:var(--bad-soft); color:var(--bad)}
  .pill.you{background:var(--warn-soft); color:var(--warn)}
  .avatar{
    width:22px; height:22px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; color:#fff; flex:0 0 auto; letter-spacing:.02em;
  }
  .who{display:inline-flex; align-items:center; gap:7px; white-space:nowrap}
  .num{font-variant-numeric:tabular-nums}

  /* Stat strip */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px}
  .stat{padding:15px 17px 13px; position:relative; overflow:hidden}
  .stat::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--accent); opacity:.85}
  .stat.hot::before{background:var(--warn)} .stat.bad::before{background:var(--bad)} .stat.ok::before{background:var(--ok)}
  .stat .v{font-size:27px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-top:2px}
  .stat.hot .v{color:var(--warn)}
  .stat.bad .v{color:var(--bad)}
  .stat.ok .v{color:var(--ok)}

  /* Filters */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
  .filters input[type=search]{min-width:200px}

  /* Run table */
  .runs{overflow-x:auto}
  table.run-table{width:100%; border-collapse:collapse; min-width:820px}
  .run-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    padding:10px 14px; border-bottom:1px solid var(--border); font-weight:700;
  }
  .run-table td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
  .run-table tr:last-child td{border-bottom:0}
  .run-table tbody tr{cursor:pointer; transition:background .1s}
  .run-table tbody tr:hover{background:var(--surface2); box-shadow:inset 3px 0 0 var(--accent)}
  .ent-name{font-weight:700}
  .rt-name{color:var(--muted); font-size:12.5px}

  /* Pipeline */
  .pipe{display:flex; align-items:center; min-width:150px}
  .pipe .dot{
    width:22px; height:22px; border-radius:999px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:800; border:2px solid var(--border); color:var(--muted); background:var(--surface);
    font-variant-numeric:tabular-nums;
  }
  .pipe .dot.done{background:var(--ok); border-color:var(--ok); color:#fff}
  .pipe .dot.current{border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .pipe .link{height:2px; width:14px; background:var(--border); flex:0 0 auto}
  .pipe .link.done{background:var(--ok)}
  .pipe-caption{font-size:12px; color:var(--muted); margin-top:5px}
  .pipe-caption b{color:var(--ink)}

  /* Task cards */
  .task-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px}
  .task-card{padding:16px; display:flex; flex-direction:column; gap:10px}
  .task-card .t-step{font-size:16px; font-weight:700; letter-spacing:-.01em}
  .task-card .t-meta{font-size:12.5px; color:var(--muted)}
  .task-card .t-actions{display:flex; gap:8px; margin-top:2px}

  /* Entity / workflow cards */
  .stack{display:flex; flex-direction:column; gap:16px}
  .block{padding:18px}
  .block-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  .block-head .grow{flex:1}
  .block-head input.title-input{font-weight:700; font-size:15px; min-width:220px}
  .sub-table{width:100%; border-collapse:collapse}
  .sub-table td, .sub-table th{padding:7px 8px; text-align:left; font-size:13px; border-bottom:1px solid var(--border)}
  .sub-table th{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
  .sub-table tr:last-child td{border-bottom:0}
  .assign-grid{display:grid; grid-template-columns:minmax(160px,1fr) minmax(170px, 220px); gap:6px 12px; align-items:center; margin:8px 0}
  .assign-grid .s-name{font-size:13px}
  .inline-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .muted{color:var(--muted)}
  .divider{border-top:1px solid var(--border); margin:14px 0}
  .step-row{display:flex; gap:8px; align-items:center; margin-bottom:6px}
  .step-row input{flex:1}
  .icon-btn{border:1px solid var(--border); background:var(--surface); border-radius:6px; width:28px; height:28px; cursor:pointer; font-size:12px; color:var(--muted)}
  .icon-btn:hover{color:var(--ink)}
  .hint{font-size:12px; color:var(--muted); background:var(--surface2); border-radius:8px; padding:8px 12px; margin-top:10px}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(10,16,24,.45); z-index:50; display:flex; justify-content:flex-end}
  .sheet{
    width:min(480px,100%); background:var(--surface); height:100%; overflow-y:auto; padding:24px;
    border-left:1px solid var(--border); animation:slideIn .18s ease-out;
  }
  @keyframes slideIn{from{transform:translateX(24px); opacity:0} to{transform:none; opacity:1}}
  .sheet-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:6px}
  .sheet-head h3{margin:0; font-size:18px; font-weight:700; letter-spacing:-.01em; flex:1}
  .close-x{border:0; background:none; font-size:18px; cursor:pointer; color:var(--muted); padding:2px 6px}
  .vsteps{margin:18px 0; display:flex; flex-direction:column}
  .vstep{display:flex; gap:12px}
  .vstep .v-rail{display:flex; flex-direction:column; align-items:center}
  .vstep .v-line{width:2px; flex:1; background:var(--border); min-height:14px}
  .vstep:last-child .v-line{background:transparent}
  .vstep .v-body{padding-bottom:16px; flex:1; min-width:0}
  .vstep .v-name{font-weight:700}
  .vstep .v-meta{font-size:12px; color:var(--muted); margin-top:1px}
  .vstep .v-act{margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .history{font-size:12px; color:var(--muted); border-top:1px solid var(--border); padding-top:12px; margin-top:6px}
  .history div{margin-bottom:5px}

  /* Notifications drawer */
  .notif-item{padding:12px 14px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; gap:10px; align-items:flex-start}
  .notif-item:hover{background:var(--surface2)}
  .notif-item.unread{background:var(--accent-soft)}
  .notif-item .n-dot{width:8px; height:8px; border-radius:99px; background:var(--accent); margin-top:6px; flex:0 0 auto; visibility:hidden}
  .notif-item.unread .n-dot{visibility:visible}
  .notif-item .n-t{font-size:11px; color:var(--muted); margin-top:2px}

  .empty{padding:34px; text-align:center; color:var(--muted)}
  .empty .big{margin-bottom:8px}
  .empty .big svg{width:30px; height:30px; opacity:.6}

  /* Toast */
  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:9px 16px; border-radius:9px; font-weight:600; font-size:13px; z-index:90; opacity:0; pointer-events:none;
    transition:opacity .18s;
  }
  #toast.show{opacity:1}

  @media (max-width:760px){
    .shell{flex-direction:column}
    .rail{width:100%; flex:none; height:auto; position:static; flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px}
    .brand{padding:0 8px; border-bottom:0; margin-bottom:0}
    .brand .sub, .nav-sec{display:none}
    .rail-foot{margin:0; flex-direction:row; align-items:center}
    .rail-foot .note{display:none}
    .content{padding:16px 14px 50px}
  }
</style>

<div id="toast" role="status"></div>

// Light obfuscation only — a static site cannot keep a real secret. See the note on the sign-in screen.
function pinHash(s){
  let h = 5381;
  for (let i=0;i<s.length;i++){ h = ((h<<5) + h + s.charCodeAt(i)) >>> 0; }
  return "h" + h.toString(36);
}

    const fullNote = (isDev && R.acct ? `Financials: ${R.acct}. ` : "") + (note||"");
    const a = {id:uid(), reportTypeId:rt.id, frequency:freq, recipient:rcp, note:fullNote, stepAssignees};
    e.assignments.push(a);
    if (period){
      const steps = rt.steps.map((sd,i)=>({
        name:sd.name, assigneeId:stepAssignees[sd.id]||null,
        status: i<through ? "done" : (i===through ? "current" : "todo"),
        completedAt: i<through ? daysAgo((through-i)*5+3) : null,
        completedBy: i<through ? (stepAssignees[sd.id]||null) : null,
      }));
      const done = through >= steps.length;
      runs.push({id:uid(), entityId:e.id, reportTypeId:rt.id, reportTypeName:rt.name,
        recipient:rcp, assignmentId:a.id, period, dueDate:null, createdAt:daysAgo(25),
        status:done?"done":"active", steps, history:[{ts:daysAgo(25), text:"Report run created from 2026 tracker"}]});
    }
  }
  return {users, reportTypes, entities, runs, notifications:[], activeUserId:U["West"]};
}

/* Bring data saved before accounts existed up to date. */
function migrate(){
  const ROLE_NAMES = ["Accounting Manager","VP of Investments","VP of Development"];
  const ADMINS = ["West","Andrea","Westley Oxier","Andrea Myers"];
  (state.users||[]).forEach(u=>{
    if (!u.pin) u.pin = pinHash(DEFAULT_PIN);
    if (!u.accessLevel) u.accessLevel = ADMINS.includes(u.name) ? "admin" : "member";
    if (u.isRole === undefined) u.isRole = ROLE_NAMES.includes(u.name);
    if (u.isRole && !u.role) u.role = u.name;
  });
  if (state.users && state.users.length && !state.users.some(u=>u.accessLevel==="admin"))
    state.users[0].accessLevel = "admin";
  delete state.activeUserId;
}

/* A user may act on a step when it is theirs, when it is unassigned,
   when it sits with a role placeholder matching their job role, or when they are an admin. */
function canAct(step){
  const me = activeUser(); if (!me || !step) return false;
  if (isAdmin()) return true;
  if (!step.assigneeId) return true;
  if (step.assigneeId === me.id) return true;
  const holder = userById(step.assigneeId);
  return !!holder && holder.isRole && holder.name === me.role;
}
/* A step counts as "mine" when it is assigned to me or to a role placeholder I hold. */
function isMine(step){
  const me = activeUser(); if(!me || !step) return false;
  if (step.assigneeId === me.id) return true;
  const holder = userById(step.assigneeId);
  return !!holder && holder.isRole && holder.name === me.role;
}
function myOpenRuns(){ return state.runs.filter(r=>r.status==="active" && isMine(currentStep(r))); }

/* Button wording follows the step: Approve, Send, Prepare, Review. */
function actionLabel(name){
  const n = (name||"").toLowerCase();
  if (n.startsWith("approve")) return "Approve";
  if (n.startsWith("review"))  return "Approve review";
  if (n.startsWith("send"))    return "Mark sent";
  if (n.startsWith("prepare")) return "Mark prepared";
  return "Complete step";
}

function runStatus(r){
  if (r.status==="done") return "done";
  if (r.dueDate && r.dueDate < Date.now()) return "overdue";
  return "active";
}
function currentStep(r){ return r.steps.find(s=>s.status==="current"); }
function notify(userId, runId, text){
  if (!userId) return;
  state.notifications.unshift({id:uid(), userId, runId, text, read:false, ts:Date.now()});
}
function logRun(r, text){ r.history.push({ts:Date.now(), text}); }

      const who = userById(step.assigneeId);
      return toast(`“${step.name}” is ${who?"with "+who.name:"not yours"} — only they or an admin can complete it`);

    step.status="done"; step.completedAt=Date.now(); step.completedBy=sessionUserId;

    const next = r.steps[idx+1];

      f.text().then(txt=>{
        const d=JSON.parse(txt);
        if(!d.users || !d.reportTypes || !d.entities || !d.runs) throw new Error("bad file");
        state=d; save(); render(); toast("Data imported");
      }).catch(()=>toast("That file doesn't look like tracker data"));
    };
    inp.click();
  },

/* ---------------- Rendering ---------------- */
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"), 2600);
}

function avatarHtml(u, size){
  if(!u) return `<span class="avatar" style="background:var(--muted)">–</span>`;
  const init = u.name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  return `<span class="avatar" style="background:${u.color}">${esc(init)}</span>`;
}
function whoHtml(uId){
  const u=userById(uId);
  return `<span class="who">${avatarHtml(u)}<span>${u?esc(u.name):"<i class='muted'>unassigned</i>"}</span></span>`;
}
function pipeHtml(r){
  const cur = r.steps.findIndex(s=>s.status==="current");
  return `<div class="pipe">`+ r.steps.map((s,i)=>{
    const cls = s.status==="done"?"done":(s.status==="current"?"current":"");
    const mark = s.status==="done"?"✓":(i+1);
    const u = userById(s.assigneeId);
    const link = i<r.steps.length-1?`<span class="link ${s.status==="done"?"done":""}"></span>`:"";
    return `<span class="dot ${cls}" title="${esc(s.name)}${u?" — "+esc(u.name):""}">${mark}</span>${link}`;
  }).join("") + `</div>`;
}
function statusPill(r){
  const s = runStatus(r);
  if (s==="done") return `<span class="pill done">Complete</span>`;
  if (s==="overdue") return `<span class="pill overdue">Overdue</span>`;
  const cs = currentStep(r);
  if (isMine(cs)) return `<span class="pill you">Waiting on you</span>`;
  return `<span class="pill active">In progress</span>`;
}

/* ----- Dashboard ----- */
function dashboardHtml(){
  const active = state.runs.filter(r=>r.status==="active");
  const mine = myOpenRuns();
  const overdue = active.filter(r=>runStatus(r)==="overdue");
  const doneThisYear = state.runs.filter(r=>r.status==="done").length;

  let rows = state.runs.slice();
  const q = filters.q.trim().toLowerCase();
  if(q) rows = rows.filter(r=>{
    const e=entityById(r.entityId);
    return (e&&e.name.toLowerCase().includes(q)) || r.reportTypeName.toLowerCase().includes(q)
      || r.period.toLowerCase().includes(q) || (r.recipient||"").toLowerCase().includes(q);
  });
  if(filters.type!=="all") rows = rows.filter(r=>r.reportTypeId===filters.type);
  if(filters.status!=="all") rows = rows.filter(r=>{
    if(filters.status==="mine") return r.status==="active" && isMine(currentStep(r));
    return runStatus(r)===filters.status;
  });
  const order={overdue:0, active:1, done:2};
  rows.sort((a,b)=> order[runStatus(a)]-order[runStatus(b)] || (b.createdAt-a.createdAt));

  return `
  <div class="page-head">
    <p class="eyebrow">All reporting</p>
    <h2>Where every report stands</h2>
    <p>Each row is one report run for one entity and period. Click a row to see its steps, complete work, or reassign.</p>
  </div>
  <div class="stats">
    <div class="card stat"><div class="v num">${active.length}</div><div class="l">Active report runs</div></div>
    <div class="card stat hot"><div class="v num">${mine.length}</div><div class="l">Waiting on ${esc(activeUser().name)}</div></div>
    <div class="card stat bad"><div class="v num">${overdue.length}</div><div class="l">Overdue</div></div>
    <div class="card stat ok"><div class="v num">${doneThisYear}</div><div class="l">Completed</div></div>
  </div>
  <div class="filters">
    <input type="search" placeholder="Search entity, report, period…" value="${esc(filters.q)}" data-input="filterQ">
    <select data-change="filterStatus">
      <option value="all" ${filters.status==="all"?"selected":""}>All statuses</option>
      <option value="mine" ${filters.status==="mine"?"selected":""}>Waiting on me</option>
      <option value="active" ${filters.status==="active"?"selected":""}>In progress</option>
      <option value="overdue" ${filters.status==="overdue"?"selected":""}>Overdue</option>
      <option value="done" ${filters.status==="done"?"selected":""}>Complete</option>
    </select>
    <select data-change="filterType">
      <option value="all">All report types</option>
      ${state.reportTypes.map(t=>`<option value="${t.id}" ${filters.type===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}
    </select>
  </div>
  <div class="card runs">
    ${rows.length? `<table class="run-table">
      <thead><tr><th>Entity / report</th><th>Period</th><th>Progress</th><th>Current step</th><th>Due</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>${rows.map(r=>{
        const e=entityById(r.entityId); const cs=currentStep(r);
        const cur = r.steps.findIndex(s=>s.status==="current");
        return `<tr data-action="openRun" data-run="${r.id}">
          <td><div class="ent-name">${e?esc(e.name):"?"}</div><div class="rt-name">${esc(r.reportTypeName)}${r.recipient?` · ${esc(r.recipient)}`:""}</div></td>
          <td class="num">${esc(r.period)}</td>
          <td>${pipeHtml(r)}<div class="pipe-caption">${
            r.status==="done" ? `All ${r.steps.length} steps complete`
            : `Step <b class="num">${cur+1} of ${r.steps.length}</b> · ${esc(cs?cs.name:"")}`
          }</div></td>
          <td>${r.status==="done" ? `<span class="muted">—</span>` : whoHtml(cs && cs.assigneeId)}</td>
          <td class="num">${r.dueDate?fmtDate(r.dueDate):`<span class="muted">—</span>`}</td>
          <td>${statusPill(r)}</td>
          <td>${r.status==="done" ? `<span class="muted">—</span>`
            : canAct(cs) ? `<button class="btn primary small" data-action="completeStep" data-run="${r.id}">${actionLabel(cs.name)}</button>`
            : `<span class="locked">${ICONS.lock}with ${esc((userById(cs&&cs.assigneeId)||{name:"—"}).name)}</span>`}</td>
        </tr>`;
      }).join("")}</tbody>
    </table>` : `<div class="empty"><div class="big">${ICONS.inbox}</div>No report runs match. Start one from the Entities page.</div>`}
  </div>`;
}

/* ----- Entities ----- */
function periodOptions(freq){
  const y = new Date().getFullYear();
  if(freq==="Monthly") return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map(m=>`${m} ${y}`);
  if(freq==="Quarterly") return [`Q1 ${y}`,`Q2 ${y}`,`Q3 ${y}`,`Q4 ${y}`];
  if(freq==="Semi-annual") return [`H1 ${y}`,`H2 ${y}`];
  return [`FY ${y-1}`,`FY ${y}`];
}

          <td class="num">${open}</td>
          <td><button class="btn small" data-action="resetPin" data-user="${u.id}">Reset PIN</button></td>
          <td style="text-align:right"><button class="btn small danger" data-action="deleteUser" data-user="${u.id}">Remove</button></td>
        </tr>`;
      }).join("")}
      </tbody>
    </table>
  </div>
  <datalist id="role-list">${ROLES.map(r=>`<option value="${r}">`).join("")}</datalist>
  <div class="hint">A reset PIN goes back to <b>${DEFAULT_PIN}</b>; each person can set their own from the PIN button in the top bar.</div>`;
}

/* ----- Run detail sheet ----- */
function runSheetHtml(){
  const r = state.runs.find(x=>x.id===openRunId); if(!r) return "";
  const e = entityById(r.entityId);
  const dueVal = r.dueDate ? new Date(r.dueDate).toISOString().slice(0,10) : "";
  return `<div class="overlay" data-action="closeSheet">
    <div class="sheet" data-stop="1" role="dialog" aria-label="Report run details">
      <div class="sheet-head">
        <h3>${e?esc(e.name):"?"}<br><span class="muted" style="font-weight:600; font-size:13.5px">${esc(r.reportTypeName)}${r.recipient?` → ${esc(r.recipient)}`:""} · ${esc(r.period)}</span></h3>
        <button class="close-x" data-action="closeSheet" aria-label="Close">✕</button>
      </div>
      <div class="inline-row" style="margin:6px 0 4px">
        ${statusPill(r)}
        <label class="muted" style="font-size:12px">Due
          <input type="date" value="${dueVal}" data-change="setDue" data-run="${r.id}">
        </label>
      </div>
      <div class="vsteps">
        ${r.steps.map((s,i)=>{
          const dotCls = s.status==="done"?"done":(s.status==="current"?"current":"");
          return `<div class="vstep">
            <div class="v-rail">
              <span class="dot ${dotCls}" style="width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;${
                s.status==="done"?"background:var(--ok);color:#fff;border:2px solid var(--ok)":
                s.status==="current"?"border:2px solid var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)":
                "border:2px solid var(--border);color:var(--muted)"}">${s.status==="done"?"✓":i+1}</span>
              <span class="v-line"></span>
            </div>
            <div class="v-body">
              <div class="v-name">${esc(s.name)}</div>
              <div class="v-meta">
                ${s.status==="done"
                  ? `Completed ${fmtDate(s.completedAt)} by ${esc((userById(s.completedBy)||{name:"?"}).name)}`
                  : s.status==="current" ? "In progress" : "Up next"}
              </div>
              ${s.status!=="done" ? `<div class="v-act">
                ${isAdmin() ? `<select data-change="reassignStep" data-run="${r.id}" data-idx="${i}" aria-label="Assignee">
                  <option value="">— unassigned —</option>
                  ${state.users.map(u=>`<option value="${u.id}" ${s.assigneeId===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}
                </select>` : whoHtml(s.assigneeId)}
                ${s.status==="current"
                  ? (canAct(s) ? `<button class="btn primary small" data-action="completeStep" data-run="${r.id}">${actionLabel(s.name)}</button>`
                               : `<span class="locked">${ICONS.lock}waiting on them</span>`)
                  : ""}
              </div>` : `<div class="v-act">${whoHtml(s.assigneeId)}</div>`}
            </div>
          </div>`;
        }).join("")}
      </div>
      <div class="history">
        ${r.history.slice().reverse().map(h=>`<div><span class="num">${fmtDate(h.ts)}</span> — ${esc(h.text)}</div>`).join("")}
      </div>
      ${isAdmin()?`<div style="margin-top:16px"><button class="btn small danger" data-action="deleteRun" data-run="${r.id}">Delete this run</button></div>`:""}
    </div>
  </div>`;
}

/* ----- Notifications drawer ----- */
function drawerHtml(){
  const mine = state.notifications.filter(n=>n.userId===sessionUserId);
  return `<div class="overlay" data-action="closeSheet">
    <div class="sheet" data-stop="1" style="width:min(420px,100%); padding:0" role="dialog" aria-label="Notifications">
      <div class="sheet-head" style="padding:20px 20px 12px; margin:0; border-bottom:1px solid var(--border)">
        <h3>Notifications</h3>
        <button class="btn small" data-action="markAllRead">Mark all read</button>
        <button class="close-x" data-action="closeSheet" aria-label="Close">✕</button>
      </div>
      ${mine.length? mine.map(n=>`
        <div class="notif-item ${n.read?"":"unread"}" data-action="openRun" data-run="${n.runId}">
          <span class="n-dot"></span>
          <div><div>${esc(n.text)}</div><div class="n-t num">${fmtDate(n.ts)}</div></div>
        </div>`).join("")
      : `<div class="empty"><div class="big">${ICONS.bell}</div>No notifications for ${esc(activeUser().name)} yet.<br>They'll appear when a step becomes theirs.</div>`}
    </div>
  </div>`;
}

/* ----- Root ----- */
const TITLES = {dashboard:"Dashboard", tasks:"My Tasks", entities:"Entities", workflows:"Workflows", team:"Team"};
const SETUP_VIEWS = ["entities","workflows","team"];
function render(){
  const app = document.getElementById("app");
  if (!activeUser()){                       // signed out → sign-in screen
    app.className = "";
    app.innerHTML = loginHtml();
    const pin = document.getElementById("login-pin"); if (pin) pin.focus();
    return;
  }
  app.className = "shell";
  if (SETUP_VIEWS.includes(view) && !isAdmin()) view = "dashboard";
  const bodyHtml = view==="dashboard"?dashboardHtml() : view==="tasks"?tasksHtml()
    : view==="entities"?entitiesHtml() : view==="workflows"?workflowsHtml() : teamHtml();
  app.innerHTML =
    railHtml() +
    `<div class="main">${topbarHtml(TITLES[view])}<div class="content">${bodyHtml}</div></div>` +
    (openRunId ? runSheetHtml() : "") + (drawerOpen ? drawerHtml() : "");
}

document.addEventListener("click", ev=>{
  const stop = ev.target.closest("[data-stop]");
  const el = ev.target.closest("[data-action]");
  if(!el) { return; }
  if (stop && !stop.contains(el)) return;
  // don't hijack clicks on inputs/selects inside actionable rows
  if (ev.target.closest("select,input,label") && el.tagName==="TR") return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el);
});
document.addEventListener("change", ev=>{
  const el = ev.target.closest("[data-change]");
  if(el){ const fn = actions[el.dataset.change]; if(fn) fn(el); }
});
let inputT;
document.addEventListener("input", ev=>{
  const el = ev.target.closest("[data-input]");
  if(el){ clearTimeout(inputT); inputT=setTimeout(()=>{ const fn=actions[el.dataset.input]; if(fn) fn(el);
    const s=document.querySelector("input[type=search]"); if(s){s.focus(); s.setSelectionRange(s.value.length,s.value.length);} }, 250); }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Enter" && ev.target && ev.target.id==="login-pin"){ ev.preventDefault(); actions.signIn(); return; }
  if(ev.key==="Enter" && ev.target && ev.target.id==="new-entity"){ ev.preventDefault(); actions.addEntity(); return; }
  if(ev.key==="Enter" && ev.target && ev.target.id==="new-user"){ ev.preventDefault(); actions.addUser(); return; }
  if(ev.key==="Escape" && (openRunId||drawerOpen)){ openRunId=null; drawerOpen=false; render(); }
});

save();
render();
</script>
